name: exemplia

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: iacu
      POSTGRES_PASSWORD: iacu
      POSTGRES_DB: entreprise
    ports: ["5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iacu -d entreprise"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ["6333:6333"]
    volumes:
      - qdrant:/qdrant/storage

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    ports: ["5000:5000"]
    volumes:
      - mlflow:/mlflow

volumes:
  postgres:
  qdrant:
  mlflow:
