[project]
name = "exemplia"
version = "0.1.0"
description = "Répertoire d'exemples de cas d'usage IA pour entreprises, sur modèles locaux"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.35",
    "jinja2>=3.1",
    "markdown-it-py>=3",
    "python-multipart>=0.0.20",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "openai>=3.14",
    "sqlalchemy>=2.0.53",
    "psycopg[binary]>=3.2",
    "mlflow>=3.16",
    "httpx>=0.28",
]

[dependency-groups]
rag = ["qdrant-client>=1.19", "fastembed>=0.7"]
garde = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "fr-core-news-md @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl",
]
agents = ["langgraph>=1.2", "langgraph-checkpoint-postgres>=3"]
analyse = ["sqlglot>=27", "pandas>=2.2"]
tri = ["scikit-learn>=1.6", "pandas>=2.2"]
gpu = [
    "torch>=2.8",
    "transformers>=4.56",
    "accelerate>=1.10",
    "datasets>=4.0",
    "torchvision>=0.20",
]
vertex = ["google-genai>=1.30"]
dev = ["pytest>=8.4", "ruff>=0.12"]

[tool.uv]
default-groups = ["rag", "garde", "agents", "analyse", "tri", "vertex", "dev"]


[project.scripts]
exemplia = "exemplia.app:main"
exemplia-donnees = "exemplia.socle.entreprise:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exemplia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Payload indexes have no effect:UserWarning",
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# La longueur des lignes de code est gérée par `ruff format` ; les textes longs sont tolérés.
ignore = ["E501"]
