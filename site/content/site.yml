# Menu principal : ordre des onglets et, pour chaque onglet, ses groupes (= sous-dossiers de
# content/<key>/) dans l'ordre d'affichage du menu latéral.
# type : sections (défaut), lexique.
# modules : pour un groupe, les modules de src/exemplia/ dont le README (page « Présentation ») et le
# comment-ca-marche.md (page « Comment ça marche ? ») sont publiés, dans cet ordre, après les
# fichiers du dossier du groupe.

title: Exemplia

pages:
  - key: accueil
    label: Accueil
    groups:
      accueil: Exemplia

  - key: exemples
    label: Exemples
    groups:
      cas: Cas d'usage
      cloud: Modèle cloud
    modules:
      cas: [service_client, rag, conformite, analyse_donnees, tri_tickets, workflow_agents]
      cloud: [vertex_gemini]

  - key: architecture
    label: Architecture
    groups:
      ensemble: Vue d'ensemble
      transverses: Modules transverses
    modules:
      transverses: [garde, llmops, socle]

  - key: utiliser
    label: Utiliser
    groups:
      demarrer: Installer et lancer
      resultats: Tests et résultats

  - key: lexique
    label: Lexique
    type: lexique

# Autres projets IA de tekio.org, listés dans le menu latéral de l'Accueil.
projets:
  - nom: MemorIA
    url: https://tekio.org/memoria/
    desc: Aide-mémoire data science et IA — modélisation, concepts, syntaxes, lexique et références.
  - nom: AmeliorIA
    url: https://tekio.org/amelioria/
    desc: Améliorer un modèle existant sans réentraîner de zéro — 20 méthodes, exemples mesurés.
  - nom: MemorIA GCP
    url: https://tekio.org/memoria-gcp/
    desc: Aide-mémoire data, IA et DevOps sur Google Cloud.
